name: project-name

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    sysctls:
      # Required so init-firewall.sh can DNAT localhost:5433/5434/1883 to the service containers.
      - net.ipv4.conf.all.route_localnet=1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ..:/workspace:cached
    command: sleep infinity